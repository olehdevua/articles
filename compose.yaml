services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Models are pre-downloaded in the image; never fetch from Hugging Face.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output
      # HTML copies with flattened <pre> blocks, written by convert.sh.
      - ./.prepared:/data/prepared
      - ./scripts:/data/scripts:ro
    # Relative --output makes docling write relative image links in the .md
    # (an absolute one gives /data/output/... links that break on the host).
    working_dir: /data/output
    entrypoint:
      - docling
      - convert
      - --artifacts-path
      - /opt/app-root/src/.cache/docling/models
      - --from
      - pdf
      - --from
      - html
      - --to
      - md
      # Write images as PNG files next to the .md and link them.
      - --image-export-mode
      - referenced
      # HTML <img> sources are usually remote (CDN); download them.
      - --html-image-fetch
      - all
      - --output
      - .
    command: ["/data/input"]
